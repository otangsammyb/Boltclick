# ─────────────────────────────────────────────────────────────────────────────
#  Nginx — Production Config for Restaurant WhatsApp Bot
#  Optimised for high throughput, SSL termination & WebSocket support
# ─────────────────────────────────────────────────────────────────────────────

# Auto-detect number of CPU cores
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    multi_accept        on;
    use                 epoll;
}

http {
    # ── MIME types ────────────────────────────────────────────────────────────
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    reset_timedout_connection on;

    # ── Buffer tuning ─────────────────────────────────────────────────────────
    client_body_buffer_size    16k;
    client_header_buffer_size  1k;
    client_max_body_size       20m;
    large_client_header_buffers 4 16k;

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options           SAMEORIGIN  always;
    add_header X-Content-Type-Options    nosniff     always;
    add_header X-XSS-Protection          "1; mode=block" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ── Logging ───────────────────────────────────────────────────────────────
    log_format  main  '$remote_addr - $remote_user [$time_local] '
                      '"$request" $status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent" '
                      'rt=$request_time uct=$upstream_connect_time '
                      'uht=$upstream_header_time urt=$upstream_response_time';

    access_log  /var/log/nginx/access.log main buffer=64k flush=5s;
    error_log   /var/log/nginx/error.log  warn;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # General API: 60 req/min per IP
    limit_req_zone $binary_remote_addr zone=api:20m    rate=60r/m;
    # Webhook (Meta sends bursts): 300 req/min per IP
    limit_req_zone $binary_remote_addr zone=webhook:10m rate=300r/m;
    # Admin login: 10 attempts/min
    limit_req_zone $binary_remote_addr zone=admin_login:5m rate=10r/m;

    # ── Upstream (Node app) ───────────────────────────────────────────────────
    upstream node_app {
        server 127.0.0.1:3000;
        # Add more lines here if you scale to multiple Node instances:
        # server 127.0.0.1:3001;
        keepalive 64;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;

        # Allow Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS Server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name yourdomain.com www.yourdomain.com;

        # ── SSL (managed by Certbot) ──────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # ── HSTS (enable after you confirm SSL works) ─────────────────────────
        # add_header Strict-Transport-Security "max-age=63072000" always;

        # ── Static file caching ───────────────────────────────────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://node_app;
            expires    30d;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # ── WhatsApp webhook (highest priority, no rate limit throttle) ───────
        location /webhook {
            limit_req zone=webhook burst=100 nodelay;
            proxy_pass         http://node_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 10s;
        }

        # ── CamPay payment webhook ────────────────────────────────────────────
        location /payments/webhook {
            limit_req zone=webhook burst=50 nodelay;
            proxy_pass         http://node_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Admin login rate-limiting ─────────────────────────────────────────
        location /api/admin/auth/login {
            limit_req zone=admin_login burst=5 nodelay;
            proxy_pass         http://node_app;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ── Socket.IO (WebSocket) ─────────────────────────────────────────────
        location /socket.io/ {
            proxy_pass         http://node_app;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
            proxy_set_header   X-Real-IP  $remote_addr;
            proxy_read_timeout 3600s;
        }

        # ── General API ───────────────────────────────────────────────────────
        location /api/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass         http://node_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
        }

        # ── Everything else ───────────────────────────────────────────────────
        location / {
            proxy_pass         http://node_app;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }
    }
}
