<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — RestaurantBot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.hugeicons.com/font/hgi-stroke-rounded.css" />
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --c-green: #00ed64;
      --c-dark: #001e2b;
      --c-mid: #023430;
      --c-teal: #00684a;
      --c-text: #e8f5f0;
      --c-muted: #7fa99a;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--c-dark);
      color: var(--c-text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    /* Animated background orbs - hidden in favor of 3D Canvas */
    body::before,
    body::after {
      display: none;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: var(--c-green);
      top: -150px;
      left: -150px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: var(--c-teal);
      bottom: -100px;
      right: -100px;
      animation-delay: -4s;
    }

    @keyframes orb {
      from {
        transform: translate(0, 0) scale(1);
      }

      to {
        transform: translate(40px, 40px) scale(1.15);
      }
    }

    .login-card {
      background: var(--c-mid);
      border: 1px solid var(--c-teal);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 1;
      animation: fadeUp 0.6s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .logo {
      text-align: center;
      margin-bottom: 32px;
    }

    .logo-icon {
      width: 60px;
      height: 60px;
      background: var(--c-green);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin-bottom: 14px;
      overflow: hidden;
      /* Ensure image fits */
      position: relative;
    }

    .logo-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      /* Hidden until loaded */
    }

    .logo h1 {
      font-size: 22px;
      font-weight: 800;
      color: var(--c-text);
      letter-spacing: -0.5px;
    }

    .logo p {
      font-size: 13px;
      color: var(--c-muted);
      margin-top: 4px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--c-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      background: var(--c-dark);
      border: 1.5px solid var(--c-teal);
      border-radius: 10px;
      padding: 12px 16px;
      color: var(--c-text);
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
      margin-bottom: 20px;
    }

    input:focus {
      border-color: var(--c-green);
      box-shadow: 0 0 0 3px rgba(0, 237, 100, 0.15);
    }

    .btn {
      width: 100%;
      background: var(--c-green);
      color: var(--c-dark);
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      letter-spacing: 0.02em;
    }

    .btn:hover {
      background: #00c450;
      box-shadow: 0 4px 20px rgba(0, 237, 100, 0.3);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .error-msg {
      color: #ff6b6b;
      font-size: 13px;
      text-align: center;
      margin-top: 14px;
      display: none;
    }
  </style>
</head>

<body>
  <div class="login-card">
    <div class="logo">
      <div class="logo-icon" id="logoIconContainer">
        <i class="hgi hgi-stroke hgi-restaurant" id="defaultLogoIcon" style="font-size: 28px; color: var(--c-dark)"></i>
        <img id="restaurantLogo" src="/uploads/restaurant-logo.png" alt="Logo" />
      </div>
      <h1>RestaurantBot</h1>
      <p>Admin Dashboard</p>
    </div>

    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" placeholder="admin@restaurant.com" required autocomplete="username" />

      <label>Password</label>
      <div style="position: relative; margin-bottom: 20px;">
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" style="padding-right: 40px; margin-bottom: 0;" />
        <i class="hgi hgi-stroke hgi-view" id="togglePassword" style="position: absolute; right: 14px; top: 50%; transform: translateY(-50%); cursor: pointer; color: var(--c-muted); font-size: 20px;"></i>
      </div>

      <button class="btn" type="submit" id="loginBtn">Sign In</button>
    </form>
    <p class="error-msg" id="errorMsg">Invalid credentials. Please try again.</p>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const errMsg = document.getElementById('errorMsg');
      btn.disabled = true;
      btn.textContent = 'Signing in…';
      errMsg.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (data.success) {
          localStorage.setItem('adminToken', data.token);
          window.location.href = '/admin/index.html';
        } else {
          errMsg.style.display = 'block';
        }
      } catch {
        errMsg.style.display = 'block';
        errMsg.textContent = 'Connection error. Is the server running?';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Sign In';
      }
    });

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function () {
      const pwd = document.getElementById('password');
      if (pwd.type === 'password') {
        pwd.type = 'text';
        this.classList.remove('hgi-view');
        this.classList.add('hgi-view-off');
      } else {
        pwd.type = 'password';
        this.classList.remove('hgi-view-off');
        this.classList.add('hgi-view');
      }
    });

    // Auto-redirect if already logged in
    if (localStorage.getItem('adminToken')) {
      window.location.href = '/admin/index.html';
    }

    // Load custom logo and restaurant name if they exist
    const logoImg = document.getElementById('restaurantLogo');
    const defaultIcon = document.getElementById('defaultLogoIcon');
    const container = document.getElementById('logoIconContainer');
    const titleEl = document.querySelector('.logo h1');

    async function loadBranding() {
      try {
        const res = await fetch('/api/admin/settings');
        const { success, data } = await res.json();
        if (success && data) {
          if (data.restaurantName) titleEl.textContent = data.restaurantName;
          if (data.logoUrl) {
            logoImg.src = data.logoUrl;
          } else {
            logoImg.style.display = 'none';
            defaultIcon.style.display = 'block';
          }
        }
      } catch (err) {
        console.error('Error loading branding:', err);
      }
    }

    logoImg.onload = () => {
      logoImg.style.display = 'block';
      defaultIcon.style.display = 'none';
      container.style.background = 'transparent';
    };
    logoImg.onerror = () => {
      logoImg.style.display = 'none';
      defaultIcon.style.display = 'block';
      container.style.background = 'var(--c-green)';
    };

    loadBranding();
  </script>

  <!-- Three.js for 3D Samsung-style Clay Desktop Wallpaper Background -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const canvas = document.createElement('canvas');
    canvas.id = 'bgCanvas';
    canvas.style.position = 'fixed';
    canvas.style.top = '0';
    canvas.style.left = '0';
    canvas.style.width = '100vw';
    canvas.style.height = '100vh';
    canvas.style.zIndex = '0';
    canvas.style.pointerEvents = 'none'; // so it doesn't block clicks
    document.body.prepend(canvas);

    const scene = new THREE.Scene();
    // Keeps the nice dark body background but adds the bright pastel clay objects overlaid
    
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 20;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    const dirLight2 = new THREE.DirectionalLight(0xffeaa7, 0.6); // Warm fill light
    dirLight2.position.set(-15, -15, -10);
    scene.add(dirLight2);

    const dirLight3 = new THREE.DirectionalLight(0xc1a1ff, 0.4); // Purple rim light
    dirLight3.position.set(15, -10, 5);
    scene.add(dirLight3);

    // Soft clay materials
    const matConfig = { roughness: 0.85, metalness: 0.05 };
    const colors = [0xffadc9, 0x8fd6e8, 0xffe98f, 0xc1a1ff, 0xaaf0d1, 0xffb347];
    const geometries = [
        new THREE.TorusGeometry(1.8, 0.8, 32, 64),
        new THREE.IcosahedronGeometry(2.2, 4), // Smooth sphere-like
        new THREE.CylinderGeometry(1.5, 1.5, 4, 32),
        new THREE.ConeGeometry(2, 4, 32),
        new THREE.TorusKnotGeometry(1.2, 0.4, 100, 16)
    ];

    const shapes = [];

    // Create 12 floating shapes
    for(let i=0; i<12; i++) {
        const geo = geometries[Math.floor(Math.random() * geometries.length)];
        const color = colors[Math.floor(Math.random() * colors.length)];
        const mat = new THREE.MeshStandardMaterial({ ...matConfig, color: color });
        const mesh = new THREE.Mesh(geo, mat);
        
        // Random positions spread across screen primarily filling empty space
        mesh.position.x = (Math.random() - 0.5) * 35;
        mesh.position.y = (Math.random() - 0.5) * 25;
        // Z clustering around -5 to -15
        mesh.position.z = (Math.random() * -15) + 5; 
        
        mesh.rotation.x = Math.random() * Math.PI;
        mesh.rotation.y = Math.random() * Math.PI;
        
        mesh.userData = {
            rx: (Math.random() - 0.5) * 0.005,
            ry: (Math.random() - 0.5) * 0.005,
            rz: (Math.random() - 0.5) * 0.002,
            oy: mesh.position.y,
            timeOff: Math.random() * 1000,
            speed: 0.0005 + Math.random() * 0.001
        };
        
        scene.add(mesh);
        shapes.push(mesh);
    }

    let mouseX = 0;
    let mouseY = 0;
    let targetCameraX = 0;
    let targetCameraY = 0;

    document.addEventListener('mousemove', (event) => {
        mouseX = (event.clientX / window.innerWidth) * 2 - 1;
        mouseY = -(event.clientY / window.innerHeight) * 2 + 1;
    });

    function animate() {
        requestAnimationFrame(animate);
        const time = Date.now();
        
        targetCameraX = mouseX * 6; // Move strength X
        targetCameraY = mouseY * 6; // Move strength Y
        
        // Smooth dampening for the camera
        camera.position.x += (targetCameraX - camera.position.x) * 0.05;
        camera.position.y += (targetCameraY - camera.position.y) * 0.05;
        camera.lookAt(scene.position);

        shapes.forEach(mesh => {
            mesh.rotation.x += mesh.userData.rx;
            mesh.rotation.y += mesh.userData.ry;
            mesh.rotation.z += mesh.userData.rz;
            // Smooth floating vertical motion
            mesh.position.y = mesh.userData.oy + Math.sin(time * mesh.userData.speed + mesh.userData.timeOff) * 2;
        });
        renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>

</html>
